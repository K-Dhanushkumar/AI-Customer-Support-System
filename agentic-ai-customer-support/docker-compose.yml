services:
  app:
    build: .
    container_name: agentic-ai-customer-support
    env_file:
      - .env
    volumes:
      - .:/app
    command: python main.py

  api:
    build: .
    container_name: agentic-ai-customer-support-api
    env_file:
      - .env
    volumes:
      - .:/app
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
